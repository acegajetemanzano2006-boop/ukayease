{% extends "base.html" %}
{% block title %}Add Product — UkayEase{% endblock %}
{% block page_title %}Add Product{% endblock %}

{% block content %}
<div class="card form-card">
    <form method="POST" action="{{ url_for('add_product') }}" class="product-form">
        <div class="form-row">
            <div class="form-group">
                <label for="item_name">Item Name *</label>
                <input type="text" id="item_name" name="item_name" required
                       value="{{ form.get('item_name', '') }}"
                       placeholder="e.g. Vintage Denim Jacket">
            </div>
            <div class="form-group">
                <label for="category">Category *</label>
                <select id="category" name="category" required>
                    <option value="">— Select category —</option>
                    {% for c in categories %}
                    <option value="{{ c }}" {% if form.get('category') == c %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="size">Size</label>
                <input type="text" id="size" name="size"
                       value="{{ form.get('size', '') }}"
                       placeholder="e.g. M, 32, One Size">
            </div>
            <div class="form-group">
                <label for="price">Price (₱) *</label>
                <input type="number" id="price" name="price" required min="0" step="0.01"
                       value="{{ form.get('price', '') }}"
                       placeholder="0.00">
            </div>
            <div class="form-group">
                <label for="quantity">Quantity *</label>
                <input type="number" id="quantity" name="quantity" required min="0" step="1"
                       value="{{ form.get('quantity', '1') }}"
                       placeholder="1">
            </div>
        </div>

        <p class="form-note">Status is set automatically: Available if quantity &gt; 0, Sold if 0.</p>

        <div class="form-actions">
            <a href="{{ url_for('products') }}" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary">Add Product</button>
        </div>
    </form>
</div>
{% endblock %}
